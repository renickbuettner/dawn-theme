{# Dawn override: the quantity select names its product for assistive tech #}
<select class="mall-selectbox-sm js-mall-quantity" data-id="{{ product.hashId }}" name="quantity" aria-label="{{ 'offline.mall::frontend.quantity'|trans }}: {{ product.variant.name|default(product.data.name) }}">
    {% set min = product.data.quantity_min|default(__SELF__.defaultMinQuantity) %}
    {% set max = product.data.quantity_max|default(__SELF__.defaultMaxQuantity) %}
    {% for i in range(min, max) %}
        <option value="{{ i }}" {{ i == product.quantity ? 'selected="selected"' : '' }}>{{ i }}</option>
    {% endfor %}
</select>
