# Renick Dawn seed instructions — `php artisan theme:seed <theme-folder>`.
#
# The argument is the theme's DIRECTORY name (`renick-dawn` on a Marketplace
# install), not its Renick.Dawn code. `php artisan theme:list` prints it.
#
# The dawn_en (/en) and dawn_de (/de) sites must exist first — steps name their
# target site and SKIP rather than mis-place rows when it is missing. Order
# matters: EN before DE, taxonomy before posts. Idempotent via update_existing.
#
# Steps use the plugin's SiteAwareRecordImport so the import lands on the named
# site regardless of CLI site context; DE rows carry site_root_id pointing at
# their EN counterpart, which links them as multisite translations.
- name: Media (photos + PDF)
  class: Media\Models\MediaLibraryItemImport
  file: seeds/data/media.json
  attributes:
      file_format: json

- name: Blog Tags (EN)
  class: Renick\Content\Models\SiteAwareRecordImport
  file: seeds/data/blog-tags-en.json
  attributes:
      file_format: json
      blueprint_uuid: dawnblogtag00014a1b8c2d9e3f00000001
      update_existing: true
      site: dawn_en

- name: Blog Tags (DE)
  class: Renick\Content\Models\SiteAwareRecordImport
  file: seeds/data/blog-tags-de.json
  attributes:
      file_format: json
      blueprint_uuid: dawnblogtag00014a1b8c2d9e3f00000001
      update_existing: true
      site: dawn_de

