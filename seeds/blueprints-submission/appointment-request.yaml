# Generated by October (Str::uuid), the same value the backend writes for a new blueprint
uuid: 761844d2-ca3a-4768-a7d1-afbb9436697e
handle: Dawn\AppointmentRequest
type: submission
name: dawn.appointment.name
multisite: all

# Sent to the backend group notified below; entries arrive disabled and are approved by hand.
submission:
    titleTemplate: "{{ name }} — {{ preferred_date ? preferred_date|date('Y-m-d') }}"
    notifyGroup: owners
    notifyReplyTo: email
    spamSweepDays: 30
    purgeRejectedDays: 30

navigation:
    parent: Dawn\Page
    label: dawn.appointment.nav.requests
    icon: icon-calendar-check-o
    order: 340

fields:
    name:
        label: dawn.appointment.field.name
        type: text
        span: left
        validation: required|max:120

    email:
        label: dawn.appointment.field.email
        type: text
        span: right
        validation: required|email

    phone:
        label: dawn.appointment.field.phone
        type: text
        span: left
        validation: max:60

    topic:
        label: dawn.appointment.field.topic
        type: dropdown
        span: right
        validation: required
        options:
            consultation: dawn.appointment.topic.consultation
            quote: dawn.appointment.topic.quote
            support: dawn.appointment.topic.support

    preferred_date:
        label: dawn.appointment.field.preferred_date
        type: datepicker
        mode: date
        span: left
        validation: required|date

    message:
        label: dawn.appointment.field.message
        type: textarea
        size: small
        span: full
        comment: dawn.appointment.field.message_comment
        validation: max:2000

    # Optional attachment: stored privately (frontend submissions never land in uploads/public)
    attachment:
        label: dawn.appointment.field.attachment
        type: fileupload
        maxFiles: 2
        fileTypes: pdf,png,jpg
        comment: dawn.appointment.field.attachment_comment

    privacy:
        label: dawn.appointment.field.privacy
        type: checkbox
        span: full
        validation: accepted

    # Internal: never part of the frontend form, so it carries no validation
    internal_note:
        label: dawn.appointment.field.internal_note
        type: textarea
        size: small
        span: full
        comment: dawn.appointment.field.internal_note_comment
