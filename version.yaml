1.0.0: First version of Renick Dawn.
1.0.1: Fix the frontend erroring out on Marketplace installs — layouts, pages and the combined assets no longer assume the theme folder is named "dawn" (Composer installs it as "renick-dawn").
1.0.2: Install in one pass on a Marketplace install — "theme:seed" now creates the dawn_en and dawn_de sites instead of assuming they exist, binds them to the child theme October generates for the locked Composer theme, and imports the frontend translations itself, so neither "theme:use" nor "translate:scan" is needed. Requires Renick.Content 1.0.3.
